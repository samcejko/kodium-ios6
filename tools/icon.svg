<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kodium: the app icon in the iOS 6 manner (full bleed: iOS rounds the corners; the gloss is drawn here, the
       icon is prerendered). tools/gen_assets.py renders it with rsvg-convert. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9cf0"/>
      <stop offset="0.5" stop-color="#1f74cc"/>
      <stop offset="1" stop-color="#0c4590"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#5fb4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fb4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9f8"/>
    </linearGradient>
    <filter id="press" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="14" result="shadow"/>
      <feFlood flood-color="#05264f" flood-opacity="0.75"/>
      <feComposite in2="shadow" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- the code mark: < / > -->
  <g filter="url(#press)" fill="none" stroke="url(#glyph)" stroke-width="86" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="356,322 176,512 356,702"/>
    <polyline points="668,322 848,512 668,702"/>
    <line x1="584" y1="262" x2="440" y2="762"/>
  </g>
  <!-- the gloss over the top half -->
  <path d="M0,0 H1024 V430 C780,500 244,500 0,430 Z" fill="url(#gloss)"/>
  <!-- a thin light edge at the top, a dark one at the bottom -->
  <rect x="0" y="0" width="1024" height="6" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="0" y="1018" width="1024" height="6" fill="#000000" fill-opacity="0.35"/>
</svg>
